<div class="background-image"></div>
<div class="main">
  <div>
    <h1>{{ FamilleName }}</h1>
    <hr style="height: 2px; margin: 4px 0px;">
    <hr style="height: 2px; margin: 4px 0px;">
    <div *ngFor="let category of filteredCategorie">
      <h3 *ngIf="category.name != FamilleName">{{ category.name }}</h3>

      <div *ngFor="let product of filteredProducts">
        <div class="productTitle">
          <div style="width: 50%;">
            <h6>{{ product.name }}</h6>
          </div>
          <div style="width: 50%;">
            <h6>{{ product.prix }} TND</h6>
          </div>
        </div>
        <p>{{ product.description }}</p>
      </div>
      <hr style="height: 1.5px;">
    </div>
  </div>
</div>
